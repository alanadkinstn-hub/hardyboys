<head>

<title>Hardy Boys Collection</title>

<style>
:root{--navy:#1a4f78;--navy2:#2b6fa3;--spine:#3a8cc4;--gold:#c9a227;--gold2:#e6c65c;--cream:#f7f1e1;--paper:#fffdf7;--ink:#1b1b1b;--muted:#6b6b6b;--line:#e4dcc6;--ok:#2e7d4f;--red:#a33;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:var(--cream);padding:calc(var(--safe-t) + 10px) 14px 10px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header h1{font:700 19px/1.2 Georgia,serif;margin:0;flex:1;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{background:none;border:0;color:var(--gold2);font-size:17px;padding:4px 6px 4px 0;cursor:pointer}
header .hbadge{width:30px;height:30px;border:2px solid var(--gold);display:grid;place-items:center;font:700 13px Georgia,serif;color:var(--cream)}
main{padding:12px 12px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--navy);display:flex;border-top:2px solid var(--gold);box-shadow:0 -3px 0 var(--spine);padding-bottom:var(--safe-b)}
nav.tabs a{flex:1;text-align:center;color:#c8cfe0;text-decoration:none;font-size:11px;padding:8px 0 7px}
nav.tabs a .ic{display:block;font-size:20px;line-height:24px}
nav.tabs a.on{color:var(--gold2)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.serieshead{font:700 13px/1 -apple-system,sans-serif;color:var(--navy2);text-transform:uppercase;letter-spacing:1px;margin:18px 4px 8px}
.scard{display:block;text-decoration:none;color:inherit}
.scard h3{margin:0 0 2px;font:700 17px/1.25 Georgia,serif;color:var(--navy)}
.scard .sub{color:var(--muted);font-size:13px}
.bar{height:8px;background:#ece4cc;border-radius:5px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.hero{background:linear-gradient(160deg,var(--navy) 55%,var(--spine));color:var(--cream);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:2px solid var(--gold)}
.hero .big{font:700 28px Georgia,serif;color:var(--gold2)}
.hero .row{display:flex;gap:18px;flex-wrap:wrap}
.hero .lbl{font-size:12px;opacity:.8}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{border:1px solid var(--navy2);background:var(--paper);color:var(--navy2);border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy2);color:#fff}
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sub-h{background:#efe7cf;color:var(--navy);font:700 12px/1 sans-serif;letter-spacing:1px;text-transform:uppercase;padding:8px 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.num{min-width:38px;height:38px;border-radius:8px;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font:700 14px Georgia,serif}
.row.owned .num{background:var(--gold);color:var(--navy)}
.thumb{width:34px;height:50px;border-radius:3px;object-fit:cover;flex:none;background:#efe7cf;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.thumb.none{box-shadow:none;border:1px dashed #d8cda9}
.b.rate{background:var(--navy);color:var(--gold2)}
.coverwrap{display:flex;gap:14px;align-items:flex-start}
.bigcover{width:132px;min-height:60px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);flex:none;background:#efe7cf;object-fit:cover}
.nocover{width:132px;height:196px;border-radius:6px;border:2px dashed #d8cda9;display:grid;place-items:center;color:#a99a6d;font-size:13px;text-align:center;padding:8px;flex:none}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.cap a{color:var(--navy2)}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.rates button{height:40px;border-radius:8px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);font:700 15px Georgia,serif;cursor:pointer;padding:0}
.rates button.lit{background:#f3e3a6;border-color:var(--gold)}
.rates button.on{background:var(--gold);border-color:var(--navy);color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.row.editing{cursor:default;gap:8px;padding-left:4px}
.row.dragging{background:#fff6d6;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:5}
.handle{touch-action:none;width:40px;height:48px;flex:none;border:0;background:transparent;color:var(--navy2);font-size:24px;cursor:grab;-webkit-user-select:none;user-select:none}
.mv{display:flex;flex-direction:column;gap:4px;flex:none}
.mv button{width:44px;height:30px;border-radius:8px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);font-size:13px;cursor:pointer}
.mv button:disabled{opacity:.3}
.row .star{filter:grayscale(1);opacity:.35}.row .star.on{filter:none;opacity:1}
.smallbtn{font-size:13px!important;padding:7px 10px!important}
.rmain{flex:1;min-width:0}
.rt{font:600 15.5px/1.25 Georgia,serif;color:var(--ink)}
.rs{font-size:12.5px;color:var(--muted);margin-top:2px}
.badges{display:inline-flex;gap:4px;margin-left:4px;vertical-align:1px}
.b{font:700 10.5px/1 sans-serif;padding:3px 5px;border-radius:4px;background:#e9e2cc;color:#555}
.b.ot{background:#7a2e1f;color:#fff}.b.rt{background:#1f4e7a;color:#fff}.b.dj{background:var(--gold);color:var(--navy)}.b.sp{display:inline-flex;align-items:center;gap:3px;background:#fff;color:#444;border:1px solid #d8cda9}.b.sp i,.spc i{display:inline-block;width:8px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.35)}.spchips{display:flex;flex-wrap:wrap;gap:6px}.spc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);border-radius:16px;padding:7px 11px;font:600 14px inherit;font-family:inherit;cursor:pointer;min-height:36px}.spc i{width:10px;height:15px}.spc.on{background:var(--navy2);color:#fff;box-shadow:inset 0 0 0 2px var(--gold)}.b.w{background:#fff3c4;color:#7a5a00;border:1px solid var(--gold)}
.own{width:44px;height:44px;border-radius:50%;border:2px solid var(--navy2);background:#fff;color:var(--navy2);font-size:20px;cursor:pointer;flex:none;display:grid;place-items:center;font-weight:700}
.own.on{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px}
.star{background:none;border:0;font-size:22px;color:#c9c0a5;cursor:pointer;padding:4px;flex:none}
.star.on{color:var(--gold)}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:16px/1.3 inherit;padding:10px 12px;border:1px solid #cfc5a8;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--navy2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:600 15px inherit;background:var(--navy2);color:#fff;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:transparent;color:var(--navy2);border:1px solid var(--navy2)}.btn.red{background:var(--red)}
.btn.block{display:block;width:100%;text-align:center;margin-top:10px}
.seg{display:flex;border:1px solid var(--navy2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:var(--navy2);padding:10px 4px;font:600 14px inherit;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--navy2);color:#fff}
.copy{display:flex;gap:12px;align-items:flex-start}
.copy img{width:64px;height:86px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.ph{width:64px;height:86px;border-radius:6px;background:#efe7cf;display:grid;place-items:center;color:#a99a6d;font-size:26px;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}
.note{background:#fff8e1;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;font-size:14px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* Toast lives inside the sticky header, in place of the title, so it never sits over list rows, the Back button or the tab bar. */
header{min-height:calc(var(--safe-t) + 54px)}
#toast{flex:1;min-width:0;display:none;align-items:center;gap:6px;background:var(--gold);color:var(--navy);border-radius:10px;padding:4px 4px 4px 10px;min-height:38px;animation:tin .18s ease-out}
#toast.show{display:flex}
#toastMsg{flex:1;min-width:0;font:600 13.5px/1.25 -apple-system,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
#toast button{border:0;cursor:pointer;font:700 14px/1 -apple-system,sans-serif;min-height:34px;padding:0 10px;border-radius:8px}
#toastAct{background:var(--navy);color:var(--gold2)}
#toastX{background:transparent;color:var(--navy);font-size:18px!important;min-width:34px}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h4{margin:0 0 4px;font:700 17px Georgia,serif;color:var(--navy)}
.sheet .btn{display:block;width:100%;margin-top:8px}
.photoPrev{max-width:160px;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0}
.about p,.about li{font-size:14.5px}
.about a{color:var(--navy2)}
.banner{background:#fff3c4;border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
details summary{cursor:pointer;font-weight:600;color:var(--navy2)}
</style>
</head>

<script>
'use strict';
// ---------- storage (IndexedDB with localStorage fallback) ----------
const DB_NAME='hardyboys-catalog', STORE='kv';
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
function kvGet(k){if(!idb){try{return Promise.resolve(JSON.parse(localStorage.getItem('hb_'+k)))}catch(e){return Promise.resolve(null)}}
 return new Promise(res=>{const t=idb.transaction(STORE).objectStore(STORE).get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null)})}
function kvSet(k,v){if(!idb){localStorage.setItem('hb_'+k,JSON.stringify(v));return Promise.resolve()}
 return new Promise((res,rej)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

const S={copies:[],wish:{},custom:[],meta:{},titles:{},rank:{}};
async function load(){await openDB();S.copies=(await kvGet('copies'))||[];S.wish=(await kvGet('wish'))||{};S.custom=(await kvGet('custom'))||[];S.meta=(await kvGet('meta'))||{};S.titles=(await kvGet('titles'))||{};S.rank=(await kvGet('rank'))||{};
 if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}}
async function save(){await Promise.all([kvSet('copies',S.copies),kvSet('wish',S.wish),kvSet('custom',S.custom),kvSet('meta',S.meta),kvSet('titles',S.titles),kvSet('rank',S.rank)])}

// ---------- catalog helpers ----------
function allSeries(){const cs=S.custom.length?[{key:'custom',name:'My Additions',short:'My Additions',publisher:'Added by you',note:'Titles you added that are not in the built-in checklist (e.g., foreign editions, graphic novels, oddities).',group:'Mine',books:S.custom}]:[];return SERIES.concat(cs)}
const BOOK={}; function indexBooks(){for(const k in BOOK)delete BOOK[k];for(const s of allSeries())for(const b of s.books)BOOK[s.key+'-'+b.n]={...b,sk:s.key,sname:s.short,id:s.key+'-'+b.n}}
const hasTexts=b=>b.ry!=null; // OT/RT applies
function copiesOf(id){return S.copies.filter(c=>c.bookId===id)}
function ownedOf(id){return S.copies.some(c=>c.bookId===id)}
function textOwned(id,t){return S.copies.some(c=>c.bookId===id&&c.text===t)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function seriesStats(s){let own=0,ot=0,rt=0,tx=0,wish=0;for(const b of s.books){const id=s.key+'-'+b.n;if(ownedOf(id))own++;if(S.wish[id])wish++;if(b.ry!=null){tx++;if(textOwned(id,'Original'))ot++;if(textOwned(id,'Revised'))rt++}}return{own,total:s.books.length,ot,rt,tx,wish}}
const pct=(a,b)=>b?Math.round(100*a/b):0;
// ---------- per-title data: rating + covers ----------
const T=id=>S.titles[id]||(S.titles[id]={});
// #1–38 of the original series get separate Original-text (rOT) and Revised-text (rRT) ratings; everything else a single 'rating'.
const dual=b=>!!b&&b.sk==='gd'&&b.ry!=null;
const getR=(id,k)=>(S.titles[id]&&S.titles[id][k])||0;
const ratingOf=id=>dual(BOOK[id])?Math.max(getR(id,'rOT'),getR(id,'rRT')):getR(id,'rating');
function tidyTitle(id){const t=S.titles[id];if(t&&!t.rating&&!t.rOT&&!t.rRT&&!t.cover)delete S.titles[id]}
// Older data/backups stored one 'rating' per title; on #1–38 that becomes the Original-text rating.
function migrateTitles(titles){let n=0;for(const[id,t]of Object.entries(titles||{})){if(t&&t.rating&&dual(BOOK[id])){if(!t.rOT)t.rOT=t.rating;delete t.rating;n++}}return n}
const olURL=(cid,sz)=>`https://covers.openlibrary.org/b/id/${cid}-${sz}.jpg`;
function userCover(id){const t=S.titles[id];if(!t||!t.cover)return'';if(t.cover.startsWith('copy:')){const c=S.copies.find(x=>x.id===t.cover.slice(5));return(c&&c.photo)||''}return t.cover}
function stockCovers(id){const c=COVERS[id];if(!c)return[];const o=[];if(c.ot)o.push({...c.ot,era:'ot'});if(c.rt)o.push({...c.rt,era:'rt'});if(c.c)o.push({...c.c,era:''});return o}
function preferredStock(id){const st=stockCovers(id);if(st.length<2)return st[0];const ot=textOwned(id,'Original'),rt=textOwned(id,'Revised');return st.find(x=>x.era===(rt&&!ot?'rt':'ot'))||st[0]}
function eraLabel(b,c){const ed=`${c.pub||'Unknown publisher'}${c.yr?' edition, '+c.yr:' edition'}`;
 if(c.era==='ot')return c.fac?`Applewood facsimile${c.yr?' ('+c.yr+')':''}: reproduces original-text era art`:`Original-text era cover · ${ed}`;
 if(c.era==='rt')return`Revised-text era cover · ${ed}`;return`Stock cover · ${ed}`}

const FORMATS=[
 ['Grosset & Dunlap (canon)',['Red cloth (1927–32)','Red spine','Brown cloth (1932–51)','Tan tweed (1951–62)','Picture cover / “applecover” (1962+)','G&D flashlight picture cover reprint (2005–13)','G&D other / book club']],
 ['Simon & Schuster',['Wanderer paperback','Wanderer hardcover','Minstrel digest paperback','Aladdin digest paperback','Archway mass-market paperback','Aladdin paperback','Hardcover (S&S / Aladdin)','Library binding']],
 ['Other',['Applewood facsimile','British / foreign edition','Omnibus / 2-in-1 / 3-in-1','Other']]];
const ENDPAPERS=['','Brown Gretta (1932)','Orange Gretta (1932–58)','Brown multi-scene (1959–72)','White multi-scene (1961–79)','Cameo (1979–87)','Plain / blank','Other'];
const YS_FORMAT=null; // Hardy Boys: don't guess a format from the yellow-spine toggle
const ILLUS=['','Walter S. Rogers','J. Clemens Gretta','Paul Laune','A. O. Scott','Stricker','Russell H. Tandy','Bill Gillies','Rudy Nappi','John Leone','Other','Unknown'];
const SPINES=[['Yellow','#f2c81e'],['White','#f7f3e8'],['Orange','#e8822a'],['Blue','#2f78b8'],['Red','#9e2a2b'],['Green','#3f8a4a'],['Multicolor','conic-gradient(#e33,#fc3,#3a3,#39f,#e33)'],['Other','#9a8f7a'],['Unknown','repeating-linear-gradient(45deg,#ccc 0 2px,#fff 2px 4px)']];
const SPCOL=Object.fromEntries(SPINES);
// v1.7/ND1.1 stored a yes/no 'yspine'; it becomes spine:'Yellow' (yes) or unset (no).
function migrateCopies(cs){let n=0;for(const c of cs||[]){if('yspine' in c){if(c.yspine===true&&!c.spine)c.spine='Yellow';delete c.yspine;n++}}return n}
const CONDS=['','Fine','Near Fine','Very Good','Good','Fair','Poor'];

// ---------- UI plumbing ----------
let toastTimer;function hideToast(){clearTimeout(toastTimer);$('#toast').classList.remove('show');$('#title').hidden=false}
function toast(msg,actLabel,act){const t=$('#toast');$('#toastMsg').textContent=msg;const b=$('#toastAct');b.textContent=actLabel||'';b.style.display=actLabel?'':'none';
 b.onclick=()=>{hideToast();act&&act()};$('#toastX').onclick=hideToast;$('#toastMsg').onclick=hideToast;$('#title').hidden=true;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,4000)}
function setHeader(title,back){$('#title').textContent=title;$('#title').hidden=$('#toast').classList.contains('show');$('#backBtn').hidden=!back;$('#hb').hidden=!!back}
$('#backBtn').onclick=()=>history.length>1?history.back():(location.hash='#/');
function setTab(t){document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===t))}
const UI={filter:{},q:''};

function sheet(html){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML='<div class="sheet">'+html+'</div>';bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}

// ---------- rows ----------
function rowHTML(b){const id=b.id,cs=copiesOf(id),own=cs.length>0,w=!!S.wish[id];
 let badges='';if(hasTexts(b)){if(textOwned(id,'Original'))badges+='<span class="b ot">OT</span>';if(textOwned(id,'Revised'))badges+='<span class="b rt">RT</span>'}
 if(cs.some(c=>c.dj))badges+='<span class="b dj">DJ</span>';{const sp=[...new Set(cs.map(c=>c.spine).filter(v=>v&&v!=='Unknown'))];for(const v of sp)badges+=`<span class="b sp" title="${esc(v)} spine" aria-label="${esc(v)} spine" data-spine="${esc(v)}"><i style="background:${SPCOL[v]||'#999'}"></i>${esc(v==='Multicolor'?'Multi':v)}</span>`}if(w)badges+='<span class="b w">WANT</span>';if(dual(b)){const o=getR(id,'rOT'),r=getR(id,'rRT');badges=(o?'<span class="b rate">OT★'+o+'</span>':'')+(r?'<span class="b rate">RT★'+r+'</span>':'')+badges}else{const rr=getR(id,'rating');if(rr)badges='<span class="b rate">★'+rr+'</span>'+badges}
 let th='';if(!S.meta.hideCovers){const u=userCover(id),sc=u?null:preferredStock(id);th=u?`<img class="thumb" src="${u}" alt="">`:sc?`<img class="thumb pending" decoding="async" alt="" data-src="${olURL(sc.id,'M')}">`:'<div class="thumb none"></div>'}
 let sub=[];if(b.y)sub.push(b.m?b.m.slice(0,3)+' '+b.y:b.y);if(b.ry)sub.push('Rev. '+b.ry);if(UI.showSeries)sub.unshift(b.sname);
 return `<div class="row${own?' owned':''}" data-id="${id}"><div class="num">${esc(b.n)}</div>${th}<div class="rmain"><div class="rt">${esc(b.t)}</div><div class="rs">${esc(sub.join(' · '))}${badges?'<span class="badges">'+badges+'</span>':''}</div></div>
 <button class="star${w?' on':''}" data-star="${id}" aria-label="${w?'On wishlist (tap to remove)':'Add to wishlist'}" title="Wishlist">📌</button><button class="own${own?' on':''}" data-own="${id}" aria-label="Own it">${own?(cs.length>1?'×'+cs.length:'✓'):'+'}</button></div>`}
// Polite cover loading: only rows near the screen, max 2 at a time, retry with backoff (archive.org can return 503 under bursts).
const thumbQ=[];let thumbActive=0;
const thumbIO='IntersectionObserver' in window?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){thumbIO.unobserve(e.target);thumbQ.push(e.target);pumpThumbs()}},{rootMargin:'300px 0px'}):null;
function pumpThumbs(){while(thumbActive<2&&thumbQ.length){const img=thumbQ.shift();if(!img.isConnected)continue;thumbActive++;loadThumb(img,0)}}
function loadThumb(img,tries){const done=()=>{thumbActive--;pumpThumbs()};
 img.onload=()=>{img.classList.remove('pending');done()};
 img.onerror=()=>{if(tries<3&&img.isConnected){setTimeout(()=>{img.removeAttribute('src');loadThumb(img,tries+1)},1500*(tries+1)*(tries+1))}else{img.className='thumb none';img.removeAttribute('src');done()}};
 img.src=img.dataset.src}
function observeThumbs(root){root.querySelectorAll('img.thumb[data-src]:not([src])').forEach(i=>thumbIO?thumbIO.observe(i):(i.src=i.dataset.src))}
function coverRetry(img){const n=+(img.dataset.tries||0);if(n<2){img.dataset.tries=n+1;const u=img.src;setTimeout(()=>{if(img.isConnected){img.removeAttribute('src');img.src=u}},2000*(n+1))}else img.outerHTML='<div class="nocover">Cover unavailable right now (offline?)</div>'}
function bindRows(root,rerender){observeThumbs(root);root.querySelectorAll('[data-own]').forEach(el=>el.onclick=e=>{e.stopPropagation();quickOwn(el.dataset.own,rerender)});
 root.querySelectorAll('[data-star]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleWish(el.dataset.star);rerender()});
 root.querySelectorAll('.row[data-id]').forEach(el=>el.onclick=()=>location.hash='#/b/'+el.dataset.id)}

async function addCopy(id,extra){const b=BOOK[id];const c={id:uid(),bookId:id,text:hasTexts(b)?'':'N/A',format:'',dj:false,first:false,listTo:'',endpapers:'',illus:'',spine:'',numCover:'',printing:'',cond:'',djCond:'',price:'',acquired:new Date().toISOString().slice(0,10),source:'',notes:'',photo:'',created:Date.now(),...extra};
 S.copies.push(c);let unwished=false;if(S.wish[id]&&!S.wish[id].keep){delete S.wish[id];unwished=true}await save();return {c,unwished}}
async function quickOwn(id,rerender){const b=BOOK[id];const n=copiesOf(id).length;
 const go=async(extra)=>{const added=[];
  if(extra.text==='Both'){added.push((await addCopy(id,{text:'Original'})).c,(await addCopy(id,{text:'Revised'})).c)}else added.push((await addCopy(id,extra)).c);
  rerender();const ids=new Set(added.map(c=>c.id));
  const msg=extra.text==='Both'?`Added 2 copies of #${b.n} (Original + Revised)`:`Added ${n?'another ':''}copy of #${b.n}`+(extra.text&&extra.text!=='N/A'?` (${extra.text} text)`:'');
  toast(msg,'Undo',async()=>{S.copies=S.copies.filter(x=>!ids.has(x.id));await save();rerender()})};
 if(hasTexts(b)){const bg=sheet(`<h4>#${esc(b.n)} ${esc(b.t)}</h4><div class="muted small">Which text is this copy?</div>
  <button class="btn" data-x="Original" style="background:#7a2e1f">Original text (${b.y})</button><button class="btn" data-x="Revised" style="background:#1f4e7a">Revised text (${b.ry}+)</button><button class="btn gold" data-x="Both">Both: one of each</button><button class="btn ghost" data-x="">Not sure yet</button>`);
  bg.querySelectorAll('[data-x]').forEach(el=>el.onclick=()=>{bg.remove();go({text:el.dataset.x})})}
 else go({})}

function resizeImage(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let{width:w,height:h}=img;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=url})}

// ---------- My Ratings ----------
function ratingScore(id,basis){const b=BOOK[id];if(basis==='ot')return dual(b)?getR(id,'rOT'):0;if(basis==='rt')return dual(b)?getR(id,'rRT'):0;return ratingOf(id)}
// Custom order within a score group: S.rank[basis][score] = [bookId,...]. Unlisted books sort to the bottom (default order).
function pruneRank(){let ch=false;for(const basis of Object.keys(S.rank)){const g=S.rank[basis];for(const sc of Object.keys(g)){const keep=g[sc].filter((id,i,a)=>BOOK[id]&&ratingScore(id,basis)===+sc&&a.indexOf(id)===i);if(keep.length!==g[sc].length){ch=true;if(keep.length)g[sc]=keep;else delete g[sc]}}if(!Object.keys(g).length){delete S.rank[basis];ch=true;continue}
  // books that newly joined a custom-ordered group are appended to its bottom, in the order they arrived
  for(const b of rankedItems(basis,'all')){const sc=ratingScore(b.id,basis),arr=g[sc];if(arr&&!arr.includes(b.id)){arr.push(b.id);ch=true}}}return ch}
function rankedItems(basis,sf){const ser=allSeries();const order=Object.fromEntries(ser.map((s,i)=>[s.key,i]));const all=Object.values(BOOK).filter(b=>ratingScore(b.id,basis)>0);
 const def=(a,c)=>order[a.sk]-order[c.sk]||a.n-c.n;const g=S.rank[basis]||{};
 const pos=(b,sc)=>{const arr=g[sc];const k=arr?arr.indexOf(b.id):-1;return k<0?1e9:k};
 all.sort((a,c)=>{const sa=ratingScore(a.id,basis),sc=ratingScore(c.id,basis);if(sa!==sc)return sc-sa;return pos(a,sa)-pos(c,sc)||def(a,c)});
 return sf==='all'?all:all.filter(b=>b.sk===sf)}
async function setGroupOrder(basis,score,ids){const full=rankedItems(basis,'all').filter(b=>ratingScore(b.id,basis)===score).map(b=>b.id);
 // ids may be a filtered subset (series filter): splice the new subset order into the full group's order
 const set=new Set(ids);let k=0;const merged=full.map(id=>set.has(id)?ids[k++]:id);
 (S.rank[basis]||(S.rank[basis]={}))[score]=merged;await save()}
function viewRatings(){setHeader('My Ratings');setTab('ratings');UI.showSeries=true;
 if(pruneRank())save();
 const basis=UI.rBasis||'best',sf=UI.rSeries||'all',edit=!!UI.rEdit;const ser=allSeries();
 const items=rankedItems(basis,sf);const anyRated=Object.keys(BOOK).some(id=>ratingOf(id)>0);
 let h=`<div class="chips" id="basisChips">${[['best','Best of either'],['ot','Original text'],['rt','Revised text']].map(([k,l])=>`<button class="chip${basis===k?' on':''}" data-basis="${k}">${l}</button>`).join('')}</div>
 <div style="display:flex;gap:8px;margin-bottom:10px"><select id="rSeries" aria-label="Series filter" style="flex:1"><option value="all">All series</option>${ser.map(s=>`<option value="${s.key}"${sf===s.key?' selected':''}>${esc(s.short)}</option>`).join('')}</select>
 ${items.length?`<button class="btn ${edit?'gold':'ghost'}" id="editOrder" style="white-space:nowrap">${edit?'✓ Done':'↕ Edit order'}</button>`:''}</div>
 ${basis!=='best'?(()=>{const hid=Object.values(BOOK).filter(b=>!dual(b)&&ratingOf(b.id)>0&&(sf==='all'||b.sk===sf)).length;return `<div class="banner" id="basisNote">Original/Revised ratings apply only to #1–38 of the original series.${hid?` <b>${hid} other rated book${hid===1?' is':'s are'} hidden</b> — <a href="#" id="toBest">show Best of either</a>.`:''}</div>`})():''}
 ${edit?'<div class="banner" id="editHelp">Drag ≡ or use ▲ ▼ to reorder books <b>within the same score</b>. Your order is saved for this sort basis.</div>':''}`;
 if(!anyRated)h+=`<div class="card empty" id="ratingsEmpty"><div style="font-size:34px">🏆</div><b>No ratings yet</b><br>Open any book and tap a number from 1 to 10 under <b>Your rating</b>. On #1–38 of the original series you can rate the Original text and the Revised text separately.<br><br>Your rated books will be ranked here, best first.<br><a class="btn gold" href="#/s/gd" style="margin-top:12px">Browse the original series</a></div>`;
 else if(!items.length)h+='<div class="empty" id="ratingsEmpty">No rated books match this filter.</div>';
 else{h+=`<div class="small muted" style="margin:0 4px 8px">${items.length} rated · highest first</div><div class="list" id="rankList">`;let cur=0;
  const groups={};for(const b of items){const sc=ratingScore(b.id,basis);(groups[sc]||(groups[sc]=[])).push(b)}
  for(const sc of Object.keys(groups).map(Number).sort((a,c)=>c-a)){const gb=groups[sc],n=gb.length,custom=!!(S.rank[basis]&&S.rank[basis][sc]);
   h+=`<div class="sub-h" data-score="${sc}" style="display:flex;align-items:center"><span style="flex:1">★ ${sc} · ${n} book${n===1?'':'s'}${custom?' · your order':''}</span>${edit&&custom?`<button class="btn ghost smallbtn" data-reset="${sc}" style="padding:3px 8px!important;font-size:11px!important">Reset to default</button>`:''}</div>`;

  h+='</div>'}

  if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await setGroupOrder(basis,sc,ids);keep();const r2=$(`.row[data-id="${row.dataset.id}"] [data-mv="${el.dataset.mv}"]`);if(r2&&!r2.disabled)r2.focus()});

function rowEditHTML(b,sc,i,n){const r=rowHTML(b);const inner=r.slice(r.indexOf('<div class="rmain">'),r.indexOf('<button class="star'));
 return `<div class="row editing" data-id="${b.id}" data-score="${sc}"><button class="handle" aria-label="Drag to reorder" type="button">≡</button><div class="num">${esc(b.n)}</div>${inner}
 <div class="mv"><button data-mv="up" aria-label="Move up" ${i===0?'disabled':''}>▲</button><button data-mv="down" aria-label="Move down" ${i===n-1?'disabled':''}>▼</button></div></div>`}
// Drag only from the ≡ handle (touch-action:none there), so scrolling the list elsewhere never starts a drag.
function bindDrag(hd,basis,groupIds,done){hd.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const row=hd.closest('.row'),sc=row.dataset.score;
 const sibs=()=>[...row.parentNode.querySelectorAll(`.row[data-score="${sc}"]`)];if(sibs().length<2)return;
 hd.setPointerCapture(e.pointerId);row.classList.add('dragging');let lastY=e.clientY,moved=false,raf=0;
 const move=ev=>{lastY=ev.clientY;moved=true;const list=sibs();
  for(const o of list){if(o===row)continue;const r=o.getBoundingClientRect(),mid=r.top+r.height/2,me=row.getBoundingClientRect();
   if(lastY<mid&&me.top>r.top){o.before(row);break}if(lastY>mid&&me.top<r.top){o.after(row);break}}
  if(!raf){const tick=()=>{raf=0;const edge=90;if(lastY<edge+60)window.scrollBy(0,-12);else if(lastY>innerHeight-edge-70)window.scrollBy(0,12);else return;raf=requestAnimationFrame(tick)};if(lastY<150||lastY>innerHeight-160)raf=requestAnimationFrame(tick)}};
 const up=async ev=>{if(ev.pointerId!==e.pointerId)return;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);cancelAnimationFrame(raf);row.classList.remove('dragging');
  if(moved){await setGroupOrder(basis,+sc,groupIds(sc));done()}};
 // listen on window: moving the row in the DOM can drop pointer capture, but window still gets every event
 const mv=ev=>{if(ev.pointerId===e.pointerId){ev.preventDefault();move(ev)}};
 window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})}

function download(name,text,type){const blob=new Blob([text],{type});const f=new File([blob],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|iPod/.test(navigator.userAgent)){navigator.share({files:[f],title:name}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function exportChecklistCSV(){const head=['Series','No.','Title','First pub.','Revised text year','Ghostwriter','Revised by','Copies owned','Own OT','Own RT','Wanted','Want note','My rating','My rating (Original text)','My rating (Revised text)','My cover','Open Library edition'];const rows=[];
 for(const s of allSeries())for(const b of s.books){const id=s.key+'-'+b.n;rows.push([s.short,b.n,b.t,b.m?b.m+' '+b.y:b.y,b.ry,b.gw||'',b.rb||'',copiesOf(id).length,b.ry!=null?(textOwned(id,'Original')?'Yes':''):'',b.ry!=null?(textOwned(id,'Revised')?'Yes':''):'',S.wish[id]?'Yes':'',S.wish[id]?.note||'',getR(id,'rating')||'',getR(id,'rOT')||'',getR(id,'rRT')||'',userCover(id)?'Yes':'',(stockCovers(id)[0]||{}).ed?'https://openlibrary.org/books/'+stockCovers(id)[0].ed:''])}
 download(`hardy-boys-checklist-${stamp()}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}
async function importJSON(file,mode){const txt=await file.text();let d;try{d=JSON.parse(txt)}catch(e){toast('That file isn’t valid JSON');return}
 if(d.app!=='hardyboys-catalog'||!Array.isArray(d.copies)){toast('Not a Hardy Boys catalog backup');return}
 migrateTitles(d.titles);migrateCopies(d.copies);if(mode==='replace'){S.copies=d.copies;S.wish=d.wish||{};S.custom=d.custom||[];S.titles=d.titles||{};S.rank=d.rank||{}}
 else{const have=new Set(S.copies.map(c=>c.id));let n=0;for(const c of d.copies)if(!have.has(c.id)){S.copies.push(c);n++}Object.assign(S.wish,d.wish||{});for(const[k,v]of Object.entries(d.titles||{}))S.titles[k]={...(S.titles[k]||{}),...v};for(const[bs,g]of Object.entries(d.rank||{}))S.rank[bs]={...(S.rank[bs]||{}),...g};const ch=new Set(S.custom.map(c=>c.n));for(const c of d.custom||[])if(!ch.has(c.n))S.custom.push(c)}
 indexBooks();pruneRank();await save();toast(`Imported: ${S.copies.length} copies now in catalog`);route()}

function viewMore(){setHeader('Backup & More');setTab('more');
 const last=S.meta.lastBackup?new Date(S.meta.lastBackup).toLocaleDateString():'never';const photos=S.copies.filter(c=>c.photo).length;
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 let h=`${standalone?'':`<div class="card"><div style="font-weight:700;color:var(--navy2)">📱 Put it on your iPhone home screen</div><div class="small">In Safari, tap the Share button, then <b>Add to Home Screen</b>. It opens like an app and works offline.</div></div>`}
 <div class="card"><div style="font-weight:700;color:var(--navy2)">💾 Backup</div><div class="small muted">Your catalog lives only on this device. Last backup: <b>${esc(last)}</b>. ${S.copies.length} copies, ${photos} with photos.</div>
 <button class="btn block gold" id="bkFull">Export full backup (JSON, with photos)</button><button class="btn block ghost" id="bkLite">Export backup without photos (smaller)</button>
 <button class="btn block ghost" id="csvCopies">Export my copies (CSV for Excel/Numbers)</button><button class="btn block ghost" id="csvList">Export full checklist (CSV)</button>
 <button class="btn block ghost" id="imp">Import / restore a backup…</button></div>
 <div class="card"><label style="display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy2)"><input type="checkbox" id="showCovers" ${S.meta.hideCovers?'':'checked'} style="width:22px;height:22px"> Show cover thumbnails in lists</label><div class="small muted">Stock covers come from Open Library and are saved for offline use after you’ve seen them once. Turn this off to save data.</div></div>
 <div class="card"><div style="font-weight:700;color:var(--navy2)">➕ Add a title not in the checklist</div><div class="small muted">For British editions, graphic novels, oddities, etc.</div><a class="btn block ghost" href="#/addcustom">Add custom title</a></div>
 <div class="card about"><details><summary>About the checklist &amp; sources</summary>
 <p>Preloaded with ${Object.values(BOOK).filter(b=>b.sk!=='custom').length} titles across ${SERIES.length} series. Titles and years were taken from collector references and cross-checked; where a source gives no year, it’s left blank rather than guessed.</p>
 <ul>
 <li><a href="https://en.wikipedia.org/wiki/List_of_Hardy_Boys_books" target="_blank" rel="noopener">Wikipedia: List of Hardy Boys books</a>: all series lists, first-publication years, revised-text years, Casefiles months.</li>
 <li><a href="https://www.hardyboysonline.net/content.php?page=series-canon-revisions" target="_blank" rel="noopener">Hardy Boys Online: Revisions (Canon)</a>: revision timeline used to cross-check #1–38.</li>
 <li><a href="https://hardyboys.us/hbos.htm" target="_blank" rel="noopener">The Hardy Boys Unofficial Home Page (hardyboys.us): Original Series</a>: revision history, binding types (red cloth 1927–32, brown 1932–51, tan tweed 1951–62, picture covers from 1962) and endpaper types.</li>
 <li>Stock cover images: <a href="https://openlibrary.org/" target="_blank" rel="noopener">Open Library</a> (Internet Archive) via its <a href="https://openlibrary.org/dev/docs/api/covers" target="_blank" rel="noopener">Covers API</a>. Each book page links to the specific edition shown. Covers were matched at build time by title, number and publisher; titles without a confident match show no stock cover. A stock cover shows one particular edition, and original-text and revised-text covers often differ, so check the label. Era labels come from the edition date in Open Library’s record, so treat them as a guide.</li>
 <li>Ghostwriters (#1–58) and revised-text writers: Wikipedia’s list, cross-checked against the hardyboys.us author tables; disagreements are noted on the book page. Cover-artist choices follow <a href="https://hardyboys.us/hbart.htm" target="_blank" rel="noopener">hardyboys.us cover art</a> and <a href="https://www.hardyboysonline.net/content.php?page=series-canon-coverart" target="_blank" rel="noopener">Hardy Boys Online</a>.</li>
 <li><a href="https://en.wikipedia.org/wiki/Super_Mystery" target="_blank" rel="noopener">Wikipedia: Super Mystery</a>: the 1988–98 SuperMystery list.</li></ul>
 <p class="small muted">Note: the first three books were written in 1926 and released as a “breeder set” in May 1927, so 1927 is shown as their publication year. #7 <i>The Secret of the Caves</i>: revised-text year is 1965 per Wikipedia and hardyboys.us (hardyboysonline.net says 1964).</p>
 <p class="small muted">Not included yet: Papercutz graphic novels, British/Armada editions, Casefiles Collector’s Editions, Clue Book 3-in-1s. Add any of them as custom titles.</p>
 <p class="small muted">Version ${esc(APP_VERSION)}</p></details></div>
 <div class="card"><details><summary style="color:var(--red)">Danger zone</summary><div class="small muted" style="margin-top:6px">Erase everything on this device. Export a backup first.</div><button class="btn block red" id="wipe">Erase all my data</button></details></div>`;
 $('#app').innerHTML=h;
 $('#showCovers').onchange=async e=>{S.meta.hideCovers=!e.target.checked;await save()};$('#bkFull').onclick=()=>exportJSON(true);$('#bkLite').onclick=()=>exportJSON(false);$('#csvCopies').onclick=exportCopiesCSV;$('#csvList').onclick=exportChecklistCSV;
 $('#imp').onclick=()=>{const bg=sheet('<h4>Restore a backup</h4><div class="small muted">Merge adds copies you don’t already have. Replace overwrites everything on this device.</div><button class="btn" data-m="merge">Choose file · Merge</button><button class="btn red" data-m="replace">Choose file · Replace all</button><button class="btn ghost" data-m="">Cancel</button>');
  bg.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{bg.remove();if(!el.dataset.m)return;const fi=$('#importFile');fi.value='';fi.onchange=()=>fi.files[0]&&importJSON(fi.files[0],el.dataset.m);fi.click()})};
 $('#wipe').onclick=async()=>{if(!confirm('Erase ALL copies, wishlist and custom titles on this device?'))return;if(prompt('Type ERASE to confirm')!=='ERASE')return;S.copies=[];S.wish={};S.custom=[];S.titles={};S.rank={};await save();indexBooks();toast('All data erased');viewMore()}}

function viewAddCustom(){setHeader('Add custom title',true);setTab('more');
 $('#app').innerHTML=`<div class="card"><label class="f">Title</label><input type="text" id="ct"><label class="f">Series / description</label><input type="text" id="cs" placeholder="e.g., Armada UK paperback, Papercutz graphic novel #3"><label class="f">Year (optional)</label><input type="number" id="cy" inputmode="numeric"><button class="btn block gold" id="cadd">Add title</button></div>`;
 $('#cadd').onclick=async()=>{const t=$('#ct').value.trim();if(!t)return toast('Enter a title');const n=(S.custom.reduce((a,c)=>Math.max(a,c.n),0))+1;S.custom.push({n,t,y:parseInt($('#cy').value)||null,alt:$('#cs').value.trim()});await save();indexBooks();location.replace('#/b/custom-'+n)}}

// ---------- router ----------
function route(){const h=location.hash.replace(/^#\/?/,'');const p=h.split('/');
 if(p[0]==='s')viewSeries(p[1]);else if(p[0]==='b')viewBook(decodeURIComponent(p[1]));else if(p[0]==='c')viewCopy(decodeURIComponent(p[1]),p[2]);
 else if(p[0]==='search')viewSearch();else if(p[0]==='wish')viewWish();else if(p[0]==='ratings')viewRatings();else if(p[0]==='more')viewMore();else if(p[0]==='addcustom')viewAddCustom();else viewHome()}
let READY=false;window.addEventListener('hashchange',()=>{if(READY)route()});
window.addEventListener('scroll',()=>{if(!location.hash||location.hash==='#/')UI.homeScroll=window.scrollY},{passive:true});
(async()=>{await load();indexBooks();if(migrateTitles(S.titles)|migrateCopies(S.copies))await save();READY=true;route();
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body>
</html>
